<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
  <title>罗曼星球ROMANOVA防伪查询系统</title>
  <style>
    /* ===== Reset (from original reset.css) ===== */
    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, font, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center, section,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td {
      margin: 0; padding: 0; border: 0; outline: 0;
      font-size: 16px; vertical-align: baseline; background: transparent;
    }
    html, body { height: 100%; margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
    body {
      line-height: 1;
      font-family: "Noto Sans S Chinese Medium","Helvetica Neue",Helvetica,Arial,sans-serif;
      margin: 0; padding: 0;
    }
    ol, ul { list-style: none; }
    button, input { border-radius: 0; }
    a, a:hover, a:visited, a:active, a:focus { color: #000; text-decoration: none; }
    :focus { outline: 0; }
    #app { min-height: 100vh; width: 100%; margin: 0; padding: 0; }

    /* ===== Query page CSS (exact replica of security_v3.css) ===== */
    /* #app prefix boosts specificity above Element Plus */
    #app .page {
      background: transparent;
      min-height: 100vh;
      width: 100%;
    }
    #app .page .content {
      min-height: 100vh;
      position: relative;
      width: 100%;
    }
    #app .page .content .bottom-wrap {
      position: absolute;
      top: 13%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      left: 0;
      right: 0;
    }
    .page .content .bottom-wrap .text {
      font-size: 3.7vh;
      text-align: center;
      color: #e478a4;
      font-weight: bold;
      margin: 0;
      padding: 0;
      line-height: 1;
    }
    .page .content .bottom-wrap .tip {
      font-size: 2.1vh;
      text-align: center;
      color: #535252;
      margin: 0;
      padding: 0;
      line-height: 1;
    }
    .page .content .bottom-wrap .btn-wrap {
      width: 80%;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }
    .page .inp-code {
      margin: 0 auto 20px;
      display: block;
      width: 100%;
      line-height: 5.8vh;
      font-size: 2.15vh;
      text-align: center;
      border: none;
      border-radius: 50px;
      transition: all ease-in-out .3s;
      background-color: #f6f7f9;
      color: #333;
      padding: 0 20px;
      box-sizing: border-box;
    }
    .page .btn-submit {
      display: block;
      width: 100%;
      line-height: 9vh;
      border-radius: 50px;
      border: none;
      font-size: 2.7vh;
      color: #fff;
      background-color: #e378a9;
      cursor: pointer;
    }
    .page .btn-submit:disabled {
      opacity: 0.7;
    }
    .page .content .result-wrap {
      display: flex;
      justify-items: center;
      align-items: center;
      flex-direction: column;
    }
    .page .content .result-wrap .true-wrap {
      display: flex;
      align-items: center;
      flex-direction: column;
      margin: 10px 0 15px 0;
    }
    .page .content .result-wrap .true-wrap .icon-true {
      height: 6vh;
    }
    .page .content .result-wrap .true-wrap .true-tip {
      margin: 5px 0 0;
      color: #2da44d;
      font-size: 2.15vh;
      line-height: 1;
    }
    .page .content .result-wrap .r-text {
      font-size: 2.1vh;
      margin: 0;
      line-height: 1;
      color: #333;
    }
    .page .content .result-wrap.error-wrap {
      margin-top: 15px;
    }
    .page .content .icon {
      display: inline-block;
      width: 2vh;
      height: 2vh;
      margin-right: 1vh;
      font-size: 2vh;
      line-height: 2vh;
      font-family: auto !important;
      text-align: center;
      color: #fff;
      box-sizing: border-box;
      border-radius: 50px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .page .content .icon.warning {
      background-image: url('/images/icon-warn.png');
      background-size: contain;
    }
    .page .content .icon.error {
      background-image: url('/images/icon-close.png');
      background-size: contain;
    }
    .page .content .flex { display: flex; }
    .page .content .flex-acenter { align-items: center; }

    .bottom-bg {
      transition: all ease-in-out .3s;
      opacity: 0;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      object-fit: contain;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Desktop (>= 768px) — over-sm:bg on body */
    @media (min-width: 768px) {
      body.over-sm\:bg {
        background: url('/images/security_bg6.jpg') center/auto 100% no-repeat;
        background-attachment: fixed;
      }
      .over-sm\:bg .btn-wrap {
        display: flex;
        align-items: center;
      }
      .over-sm\:bg .inp-code {
        flex: 2;
        margin: 0;
        text-align: left;
        padding-left: 40px;
      }
      .over-sm\:bg .btn-submit {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        width: 25%;
        flex: 1;
        line-height: 5vh;
      }
      .bottom-bg {
        opacity: 1;
      }
    }

    /* Mobile (<= 767px) — sm:bg on .page div */
    @media (max-width: 767px) {
      .page.sm\:bg {
        background: url('/images/security_bg3.jpg') no-repeat;
        background-size: 100% 100%;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/admin-C_vA0QzN.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/admin-DmdNPXfJ.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
