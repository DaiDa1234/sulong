    /* ===== security_v3.css (exact original, expanded SCSS, paths fixed) ===== */
    .page { background: transparent; }
    .page .content .bottom-wrap { position: absolute; top: 13%; display: flex; flex-direction: column; align-items: center; justify-content: center; left: 0; right: 0; }
    .page .content .bottom-wrap .text { font-size: 3.7vh; text-align: center; color: #e478a4; font-weight: bold; }

    .page .inp-code { margin: 0 auto 20px; display: block; width: 100%; line-height: 5.8vh; font-size: 2.15vh; text-align: center; border: none; border-radius: 50px; transition: all ease-in-out .3s; background-color: #f6f7f9; }

<body class="over-sm:bg">
<div class="page page-current sm:bg">
  <div class="content">
    <div class="bottom-wrap">
      <p class="text">防伪查询</p>
      <p class="tip">请刮开涂层输入完整的防伪码</p>
      <div class="btn-wrap">
        <input type="text" id="code" class="inp-code" placeholder="输入防伪码" />
        <button class="btn-submit" id="btn-submit">验证</button>
      </div>
    </div>
    <img class="bottom-bg" src="/images/security_bg7.png" alt="">
  </div>
</div>

<script>
(function() {
  var codeEl = document.getElementById('code');
  var btnEl = document.getElementById('btn-submit');
  var wrapEl = document.querySelector('.bottom-wrap');

  function removeResults() {
    var old = wrapEl.querySelectorAll('.result-wrap');
    for (var i = 0; i < old.length; i++) {
      old[i].parentNode.removeChild(old[i]);
    }
  }

  function addResult(html) {
    var div = document.createElement('div');
    div.innerHTML = html;
    while (div.firstChild) {
      wrapEl.appendChild(div.firstChild);
    }
  }

  function query() {
    var code = codeEl.value.trim();
    if (!code) {
      return alert('请输入防伪码');
    }

    btnEl.disabled = true;
    btnEl.textContent = '查询中...';
    removeResults();

    var xhr = new XMLHttpRequest();
    var apiBase = window.__API_BASE__ || 'https://api.weisiks.net';
    xhr.open('POST', apiBase + '/api/security/get_code_result', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onload = function() {
      btnEl.disabled = false;
      btnEl.textContent = '验证';
      try {
        var data = JSON.parse(xhr.responseText);
        var html = '';
        if (data.code == 1) {
          html = '<div class="result-wrap success"><div class="true-wrap"><img src="/images/icon-true.png" class="icon-true"><p class="true-tip">罗曼星球正品</p></div>' +
            '<p class="r-text">您好！您的防伪码：' + code + '</p><p class="r-text">共进行过' + data.data.count + '次防伪查询</p><p class="r-text">首次查询时间：' + data.data.first + '</p></div>';
          if (data.data.count > 5) {
            html += '<div class="result-wrap error-wrap"><p class="r-text flex flex-acenter"><span class="icon warning"></span>该防伪码已被多次查询，谨防假冒</p></div>';
          }
        } else {
          html = '<div class="result-wrap error-wrap"><p class="r-text flex flex-acenter"><span class="icon error"></span>该防伪码不存在，谨防假冒</p></div>';
        }
        addResult(html);
      } catch(e) {
        addResult('<div class="result-wrap error-wrap"><p class="r-text flex flex-acenter"><span class="icon error"></span>查询失败，请稍后重试</p></div>');
      }
    };
    xhr.onerror = function() {
      btnEl.disabled = false;
      btnEl.textContent = '验证';
      addResult('<div class="result-wrap error-wrap"><p class="r-text flex flex-acenter"><span class="icon error"></span>查询失败，请稍后重试</p></div>');
    };
    xhr.send('fwcode=' + encodeURIComponent(code));
  }

  btnEl.addEventListener('click', query);
  codeEl.addEventListener('keyup', function(e) {
    if (e.key === 'Enter') query();
  });

  var params = new URLSearchParams(window.location.search);
  var codeParam = params.get('code');
  if (codeParam) {
    codeEl.value = codeParam;
    query();
  }
})();
</script>
</body>
